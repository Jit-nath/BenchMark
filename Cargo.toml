[package]
name = "vector-db-benchmark"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dandeliondb = { git = "https://github.com/Jit-nath/DandelionDB.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"

[profile.release]
opt-level = 3
lto = "thin"
